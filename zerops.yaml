zerops:
  - setup: alpine
    build:
      base: alpine@3.24
      prepareCommands:
        - sudo apk add --no-cache curl unzip
      buildCommands:
        - mkdir -p bin
        - curl -L -o /tmp/x.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        - unzip /tmp/x.zip xray -d bin
        - curl -L -o bin/caddy "https://caddyserver.com/api/download?os=linux&arch=amd64"
        - chmod +x bin/xray bin/caddy
        - ls -la bin
      deployFiles:
        - bin
        - Caddyfile
        - start.sh
    run:
      base: alpine@3.24
      ports:
        - port: 8080
          httpSupport: true
      start: "sh -c 'PATH=$PWD/bin:$PATH CADDYFILE=$PWD/Caddyfile sh start.sh'"
